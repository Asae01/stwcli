[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stwcli"
version = "0.1.0"
description = "Lightweight voice-controlled terminal helper"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["rapidfuzz>=3"]

[tool.setuptools]
packages = ["stwcli"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]